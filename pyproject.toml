[project]
name = "cagebox"
version = "0.1.0"
description = "MCP server for workspace file operations"
requires-python = ">=3.10"
dependencies = ["fastmcp>=3.2.4", "uvicorn>=0.46.0"]


[dependency-groups]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
