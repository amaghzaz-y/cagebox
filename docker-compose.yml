version: '3.8'

services:
  cagebox:
    build: .
    container_name: cagebox
    ports:
      - "8000:8000"
    volumes:
      - workspace:/workspace
    environment:
      CAGEBOX_PORT: 8000
      CAGEBOX_HOST: 0.0.0.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  workspace:
